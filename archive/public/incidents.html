<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Incidents — SPEL Safety</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav"></div>
  <div class="wrap">
    <h1 class="page-title">Incidents</h1>
    <p class="page-sub">All reported incidents. Click a row to investigate.</p>

    <div class="card" style="margin-bottom:16px">
      <div class="filters">
        <label class="field"><span>Unit</span><select id="f-unit"></select></label>
        <label class="field"><span>Severity</span><select id="f-severity"></select></label>
        <label class="field"><span>Status</span><select id="f-status"></select></label>
        <label class="field"><span>Type</span><select id="f-type"></select></label>
        <label class="field"><span>From</span><input type="date" id="f-from" /></label>
        <label class="field"><span>To</span><input type="date" id="f-to" /></label>
        <button class="btn sm ghost" id="clear">Clear</button>
      </div>
    </div>

    <div id="banner"></div>
    <div class="card">
      <div class="table-wrap">
        <table class="data" id="tbl">
          <thead><tr>
            <th>Ref</th><th>Date</th><th>Unit</th><th>Type</th><th>Severity</th><th>Status</th><th>Location</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="empty" class="muted" style="display:none;padding:20px;text-align:center">No incidents match these filters.</p>
      <div id="pager" style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px"></div>
    </div>
  </div>

  <script type="module" src="/js/incidents.js"></script>
</body>
</html>
